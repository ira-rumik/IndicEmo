name: Check evaluation suite
on: [push, pull_request]
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install --require-hashes -r requirements.lock
      - run: python -m unittest discover -s tests -v
      - run: python prepare.py --output-dir runs/prepared
      - run: python aggregate.py --check
      - run: python eval.py --help
      - run: python prepare.py --help
      - run: python generate.py --help
      - run: python aggregate.py --help
      - run: python summarize.py --help
